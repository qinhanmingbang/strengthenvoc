<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>秦汉名邦工程公司官网</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ---------- 色彩：青铜、夯土、汉白玉 ---------- */
:root{
  --bg:#E6EBE6; --surface:#F6F8F4; --ink:#15302D; --ink-soft:#496560; --line:#B7C5BD;
  --accent:#8A5A20; --accent-ink:#FFF8EC; --accent-deep:#5E3C12;
  --jade:#1E7753; --jade-bg:#D6ECE0; --cinnabar:#B0342A; --cin-bg:#F4DBD6;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 14px 34px -18px rgba(21,48,45,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F2523; --surface:#173431; --ink:#EAE7DB; --ink-soft:#9DB6AF; --line:#2D504B;
    --accent:#D3A25E; --accent-ink:#1A2A22; --accent-deep:#8F6A33;
    --jade:#6FD0A4; --jade-bg:#1B4A3A; --cinnabar:#F28772; --cin-bg:#4B2723;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F2523; --surface:#173431; --ink:#EAE7DB; --ink-soft:#9DB6AF; --line:#2D504B;
  --accent:#D3A25E; --accent-ink:#1A2A22; --accent-deep:#8F6A33;
  --jade:#6FD0A4; --jade-bg:#1B4A3A; --cinnabar:#F28772; --cin-bg:#4B2723;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 34px -18px rgba(0,0,0,.7);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  font-size:17px;line-height:1.7;font-weight:500;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- 顶栏 ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 20px;border-bottom:4px double var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(16px,4.4vw,20px);letter-spacing:.04em;min-width:0}
.brand svg{flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.icon{
  width:40px;height:40px;display:grid;place-items:center;
  background:transparent;border:1.5px solid var(--line);border-radius:4px;color:var(--ink);
}
.icon:hover{border-color:var(--accent);color:var(--accent)}
#btnSound .mute{display:none}
#btnSound.off .waves{display:none}
#btnSound.off .mute{display:inline}

main{max-width:900px;margin:0 auto;padding:12px 20px 56px}
footer{max-width:900px;margin:0 auto;padding:0 20px 32px;color:var(--ink-soft);font-size:14px}

/* ---------- 按钮 ---------- */
.primary{
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;
  padding:14px 34px;font-size:19px;font-weight:700;letter-spacing:.08em;
  box-shadow:0 4px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s;
}
.primary:hover{filter:brightness(1.06)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:0 4px 0 var(--accent-deep);transform:none;filter:none}
.ghost{
  background:transparent;border:1.5px solid var(--line);border-radius:4px;
  padding:10px 20px;font-size:16px;color:var(--ink);
}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.link{background:none;border:0;padding:6px 2px;color:var(--ink-soft);font-size:15px;text-decoration:underline;text-underline-offset:4px}
.link:hover{color:var(--cinnabar)}

/* ---------- 首页 ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;padding:36px 0 20px}
.hero h1{font-size:clamp(44px,8vw,76px);font-weight:900;line-height:1.1;margin:0 0 14px;letter-spacing:.06em}
.lead{font-size:19px;color:var(--ink-soft);margin:0 0 22px}
.notes{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:8px;max-width:30em}
.notes li{position:relative;padding-left:22px;line-height:1.7}
.notes li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:10px;background:var(--accent)}
.start-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cover{margin-top:30px;max-width:30em}
.cover-bar{height:10px;background:transparent;border:1px solid var(--line);border-radius:1px;overflow:hidden}
.cover-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.cover p{margin:8px 0 0;color:var(--ink-soft);font-size:15px}
.hero-art{width:100%;max-width:380px;justify-self:center}
.hero-art svg{width:100%;height:auto;display:block}
.wd-outer{fill:var(--surface);stroke:var(--accent);stroke-width:7}
.wd-ring{fill:none;stroke:var(--line);stroke-width:2}
.wd-dash{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 11}
.wd-rib{stroke:var(--accent);stroke-width:5;stroke-linecap:butt}
.wd-boss{fill:var(--accent)}
.wd-boss2{fill:none;stroke:var(--surface);stroke-width:2}
.wd-dot{fill:var(--surface)}
.wd-char{fill:var(--ink);font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-weight:900;font-size:62px;text-anchor:middle}

/* ---------- 砖墙进度 ---------- */
.wall{display:flex;gap:3px;margin:0 0 18px}
.wall span{flex:1;height:10px;border:1px solid var(--line);border-radius:1px;min-width:0}
.wall .ok{background:var(--jade);border-color:var(--jade)}
.wall .no{background:var(--cinnabar);border-color:var(--cinnabar)}
.wall .cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 40%,transparent)}

/* ---------- 答题 ---------- */
.q-head{display:flex;align-items:center;gap:16px;margin:18px 0 12px;flex-wrap:wrap}
.q-count{font-size:15px;color:var(--ink-soft)}
.q-count b{font-size:30px;color:var(--ink);font-weight:900;margin-right:4px}
.q-right{margin-right:auto;color:var(--ink-soft);font-size:15px}
.q-right b{color:var(--jade);font-size:19px}
.auto{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-soft);cursor:pointer}
.auto input{width:18px;height:18px;accent-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:28px}
.word{
  display:inline-flex;align-items:center;gap:16px;max-width:100%;
  background:none;border:0;padding:0;text-align:left;
  font-size:clamp(42px,10vw,68px);font-weight:600;line-height:1.15;letter-spacing:.01em;
  overflow-wrap:anywhere;
}
.word.m{font-size:clamp(34px,7.5vw,54px)}
.word.l{font-size:clamp(26px,5.6vw,42px)}
.word.xl{font-size:clamp(22px,4.6vw,32px);line-height:1.3}
.word .spk{
  flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--accent);color:var(--accent);transition:background .15s,color .15s;
}
.word:hover .spk,.word.talking .spk{background:var(--accent);color:var(--accent-ink)}
.prompt{margin:18px 0 14px;color:var(--ink-soft);font-size:15px}
.opts{display:grid;gap:10px}
.opt{
  display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start;width:100%;
  text-align:left;padding:12px 16px;font-size:18px;line-height:1.6;
  background:transparent;border:1.5px solid var(--line);border-radius:4px;color:var(--ink);
  transition:background .12s,border-color .12s;
}
.opt .key{
  width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--accent);border-radius:3px;
  color:var(--accent);font-weight:700;font-size:17px;
}
.opt .txt{padding-top:3px;overflow-wrap:anywhere}
.opts:not(.done) .opt:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.opts.done .opt{cursor:default}
.opt.right{border-color:var(--jade);background:var(--jade-bg)}
.opt.right .key{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.opt.wrong{border-color:var(--cinnabar);background:var(--cin-bg)}
.opt.wrong .key{background:var(--cinnabar);border-color:var(--cinnabar);color:var(--surface)}
.opt.dim{opacity:.5}

.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;min-height:78px;flex-wrap:wrap}
.fb{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.stamp{
  display:inline-block;font-weight:900;font-size:clamp(28px,6vw,40px);letter-spacing:.06em;line-height:1.25;
  padding:2px 18px;border:4px solid currentColor;border-radius:6px;
  box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px currentColor;
  transform:rotate(-4deg);animation:stamp .28s cubic-bezier(.2,1.4,.4,1) both;
}
.stamp.good{color:var(--jade)}
.stamp.bad{color:var(--cinnabar)}
.fb .ans{color:var(--ink-soft);font-size:16px}
.fb .ans b{color:var(--ink)}
@keyframes stamp{from{transform:rotate(-4deg) scale(1.7);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}

/* ---------- 成绩 ---------- */
.res{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:32px 24px 28px;text-align:center;margin-top:18px}
.res .label{margin:0;color:var(--ink-soft);font-size:16px}
.res .score{display:flex;align-items:baseline;justify-content:center;gap:12px;line-height:1;margin:10px 0 6px}
.res .score b{font-size:clamp(96px,26vw,170px);font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.res .score span{font-size:clamp(24px,6vw,36px);color:var(--ink-soft)}
.res .pct{margin:0 0 4px;font-size:17px;color:var(--ink-soft)}
.res .remark{margin:10px 0 22px;font-size:20px;font-weight:700}
.res .wall{margin:0 auto 26px;max-width:560px}
.res .acts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.record{display:inline-block;margin:0 0 10px;padding:0 12px;color:var(--cinnabar);border:2px solid currentColor;border-radius:4px;font-weight:900;transform:rotate(-3deg);letter-spacing:.1em}
.review{margin-top:36px}
.review h2{font-size:24px;font-weight:900;margin:0 0 6px}
.review .sub{margin:0 0 12px;color:var(--ink-soft);font-size:15px}
.review ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.review li{display:grid;grid-template-columns:minmax(0,290px) 1fr;gap:6px 24px;padding:14px 2px;border-bottom:1px solid var(--line)}
.rv-word{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.rv-word button{background:none;border:0;padding:0;font-size:24px;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-align:left;overflow-wrap:anywhere}
.rv-word button svg{color:var(--accent);flex:none}
.rv-mean{align-self:center}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;gap:20px;padding-top:12px}
  .hero-art{order:-1;max-width:210px}
  .card{padding:20px 16px}
  .review li{grid-template-columns:1fr}
  .opt{font-size:17px;padding:10px 12px;gap:12px}
}

/* ---------- 提示条 ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:4px;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;z-index:10;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
      <circle cx="15" cy="15" r="13" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
      <g stroke="var(--accent)" stroke-width="2" transform="translate(15 15)">
        <line x1="5" y1="0" x2="12" y2="0" transform="rotate(45)"/>
        <line x1="5" y1="0" x2="12" y2="0" transform="rotate(135)"/>
        <line x1="5" y1="0" x2="12" y2="0" transform="rotate(225)"/>
        <line x1="5" y1="0" x2="12" y2="0" transform="rotate(315)"/>
      </g>
      <circle cx="15" cy="15" r="4.2" fill="var(--accent)"/>
    </svg>
    <span>秦汉名邦工程公司官网</span>
  </div>
  <div class="tools">
    <button class="icon" id="btnSound" aria-label="音效开关" title="音效开关">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        <path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>
        <path class="mute" d="M16 9l5 6M21 9l-5 6"/>
      </svg>
    </button>
    <button class="icon" id="btnTheme" aria-label="切换明暗主题" title="切换明暗主题">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</header>

<main>

  <!-- 首页 -->
  <section id="home" class="screen">
    <div class="hero">
      <div>
        <h1>词汇测验</h1>
        <p class="lead">社会政策、学术、商业金融、法律与高级词汇，每轮 50 题，看英文选中文。</p>
        <ul class="notes">
          <li>每轮从词库的 <span class="total">0</span> 个词条里随机抽题，四个选项选一个。</li>
          <li>抽过的词会被记下来，整本词库过完一遍之前尽量不再重复。</li>
          <li>点单词或喇叭可以听发音，电脑上也可以按 A、B、C、D 作答。</li>
        </ul>
        <div class="start-row">
          <button class="primary" id="btnStart">开始测验</button>
          <button class="link" id="btnReset">清除学习记录</button>
        </div>
        <div class="cover">
          <div class="cover-bar"><i id="coverFill"></i></div>
          <p id="coverText"></p>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 400 400">
          <circle class="wd-outer" cx="200" cy="200" r="190"/>
          <circle class="wd-dash" cx="200" cy="200" r="178"/>
          <circle class="wd-ring" cx="200" cy="200" r="164"/>
          <g transform="translate(200 200)">
            <line class="wd-rib" x1="40" y1="0" x2="164" y2="0" transform="rotate(45)"/>
            <line class="wd-rib" x1="40" y1="0" x2="164" y2="0" transform="rotate(135)"/>
            <line class="wd-rib" x1="40" y1="0" x2="164" y2="0" transform="rotate(225)"/>
            <line class="wd-rib" x1="40" y1="0" x2="164" y2="0" transform="rotate(315)"/>
          </g>
          <circle class="wd-boss" cx="200" cy="200" r="46"/>
          <circle class="wd-boss2" cx="200" cy="200" r="33"/>
          <circle class="wd-dot" cx="200" cy="200" r="7"/>
          <text class="wd-char" x="200" y="112">秦</text>
          <text class="wd-char" x="306" y="220">汉</text>
          <text class="wd-char" x="200" y="328">名</text>
          <text class="wd-char" x="94" y="220">邦</text>
        </svg>
      </div>
    </div>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="screen" hidden>
    <div class="q-head">
      <div class="q-count"><b id="qNum">1</b>/ <span class="n-total">50</span></div>
      <div class="q-right">答对 <b id="qRight">0</b></div>
      <label class="auto"><input type="checkbox" id="autoSpeak">自动朗读</label>
      <button class="ghost" id="btnQuit">退出</button>
    </div>
    <div class="wall" id="wall" aria-hidden="true"></div>
    <article class="card">
      <button class="word" id="word" aria-label="点击朗读单词">
        <span id="wordText"></span>
        <span class="spk" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
        </span>
      </button>
      <p class="prompt">点单词可以朗读。选出正确的中文释义：</p>
      <div class="opts" id="opts" role="group" aria-label="四个备选答案"></div>
      <div class="foot">
        <div class="fb" id="fb" aria-live="assertive"></div>
        <button class="primary" id="btnNext" disabled>下一题</button>
      </div>
    </article>
  </section>

  <!-- 成绩 -->
  <section id="result" class="screen" hidden>
    <div class="res">
      <p class="label">本轮成绩</p>
      <div class="score"><b id="resNum">0</b><span>/ <span class="n-total">50</span></span></div>
      <p class="pct" id="resPct"></p>
      <div id="resRecord"></div>
      <p class="remark" id="resRemark"></p>
      <div class="wall" id="wall2" aria-hidden="true"></div>
      <div class="acts">
        <button class="primary" id="btnAgain">再来 50 题</button>
        <button class="ghost" id="btnHome">回到首页</button>
      </div>
    </div>
    <div class="review" id="review">
      <h2>错题回顾</h2>
      <p class="sub" id="reviewSub"></p>
      <ul id="wrongList"></ul>
    </div>
  </section>

</main>
<footer>© 秦汉名邦工程公司</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){

  (byKey[k] = byKey[k] || []).push(x);
  (byN[x.n] = byN[x.n] || []).push(x);
});

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sample(a,n){
  if(a.length<=n) return shuffle(a.slice());
  const c=a.slice();
  for(let i=0;i<n;i++){ const j=i+Math.floor(Math.random()*(c.length-i)); const t=c[i]; c[i]=c[j]; c[j]=t; }
  return c.slice(0,n);
}
let toastTimer=null;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),2600);
}
function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

/* ================= 本地记录 ================= */
const KEY='qinhan-vocab-v2';
const mem={used:[],best:0,rounds:0,sound:true,auto:false,theme:null};
try{ const raw=localStorage.getItem(KEY); if(raw) Object.assign(mem,JSON.parse(raw)); }catch(e){}
let used=new Set(mem.used);
function save(){
  mem.used=Array.from(used);
  try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){}
}

/* ================= 主题 ================= */
function applyTheme(){ if(mem.theme) document.documentElement.setAttribute('data-theme',mem.theme); }
applyTheme();
$('#btnTheme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  mem.theme = cur==='dark' ? 'light' : 'dark';
  applyTheme(); save();
});

/* ================= 音效（WebAudio 合成，青铜钟风格） ================= */
let ac=null;
function ctx(){
  if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; try{ ac=new AC(); }catch(e){ return null; } }
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function bell(freq,at,vol,dur){
  const c=ctx(); if(!c||!mem.sound) return;
  const t0=c.currentTime+at;
  const parts=[[1,1],[2.01,.38],[2.76,.2],[4.1,.09]];
  parts.forEach(function(pr){
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=freq*pr[0];
    const peak=vol*pr[1], end=t0+dur/(1+(pr[0]-1)*.6);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+.008);
    g.gain.exponentialRampToValueAtTime(0.0001,end);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(end+.05);
  });
}
function thud(freq,at,vol,dur){
  const c=ctx(); if(!c||!mem.sound) return;
  const t0=c.currentTime+at;
  const o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(freq,t0); o.frequency.exponentialRampToValueAtTime(freq*.82,t0+dur);
  f.type='lowpass'; f.frequency.value=950;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(f); f.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+.05);
}
const sfx={
  start(){ bell(523.25,0,.2,1.4); bell(783.99,.1,.14,1.3); },
  right(){ bell(783.99,0,.2,1.2); bell(1046.5,.09,.18,1.2); bell(1318.5,.18,.15,1.5); },
  wrong(){ thud(246.94,0,.26,.34); thud(196,.17,.26,.5); },
  finish(score){
    if(score>=N*0.6){
      [523.25,659.25,783.99,1046.5,1318.5,1568].forEach((f,k)=>bell(f,k*.13,.17,1.6));
    }else{
      [392,523.25,659.25].forEach((f,k)=>bell(f,k*.2,.16,1.5));
    }
  }
};
function syncSoundBtn(){
  const b=$('#btnSound'); b.classList.toggle('off',!mem.sound); b.setAttribute('aria-pressed',String(mem.sound));
}
$('#btnSound').addEventListener('click',()=>{
  mem.sound=!mem.sound; syncSoundBtn(); save();
  if(mem.sound) bell(659.25,0,.18,1);
});
syncSoundBtn();

/* ================= 语音朗读 ================= */
const canSpeak='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let voice=null;
function pickVoice(){
  if(!canSpeak) return;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  const us=vs.filter(v=>/^en[-_]US/i.test(v.lang));
  const prefer=['Google US English','Samantha','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Alex'];
  let found=null;
  for(const n of prefer){ found=us.find(v=>v.name.indexOf(n)>-1); if(found) break; }
  voice=found||us[0]||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text,btn){
  if(!canSpeak){ toast('这个浏览器不支持语音朗读，可以换 Chrome、Edge 或 Safari'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(function(){
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=.85; if(voice) u.voice=voice;
    if(btn){ btn.classList.add('talking'); u.onend=u.onerror=()=>btn.classList.remove('talking'); }
    u.onerror=function(){ if(btn) btn.classList.remove('talking'); toast('朗读失败，请检查设备是否安装了英语语音'); };
    speechSynthesis.speak(u);
  },30);
}

/* ================= 出题 ================= */
function segs(x){
  if(!x.s){
    x.s=new Set(x.m.replace(/[（(［\[][^）)］\]]*[）)］\]]/g,' ').split(/[，,；;、\s…/]+/).filter(s=>s.length>=2));
  }
  return x.s;
}
function grams(x){
  if(!x.g){
    const g=new Set();
    (x.m.match(/[\u4e00-\u9fff]+/g)||[]).forEach(function(run){
      for(let i=0;i+3<=run.length;i++) g.add(run.substr(i,3));
    });
    x.g=g;
  }
  return x.g;
}
function overlap(a,b){ for(const s of a) if(b.has(s)) return true; return false; }

function makeOptions(x){
  const sx=segs(x), gx=grams(x), lx=x.m.length, tail=x.m.charAt(x.m.length-1);
  const ok=y=>y.i!==x.i && y.m!==x.m && !overlap(sx,segs(y)) && !overlap(gx,grams(y));
  const chosen=[], seen=new Set([x.m]);
  function take(list){
    const scored=list.filter(ok).map(y=>({y:y,
      s:Math.abs(y.m.length-lx)+(y.m.charAt(y.m.length-1)===tail?0:3)+Math.random()*6
    })).sort((a,b)=>a.s-b.s);
    for(const e of scored){
      if(chosen.length>=3) break;
      if(seen.has(e.y.m)) continue;
      seen.add(e.y.m); chosen.push(e.y);
    }
  }
  take(sample(byKey[x.c+'|'+x.n]||[],200));
  if(chosen.length<3) take(sample(byN[x.n]||[],300));
  if(chosen.length<3) take(sample(WORDS,400));
  const all=shuffle([x].concat(chosen));
  return {opts:all, ans:all.indexOf(x)};
}

function pickWords(){
  const unused=WORDS.filter(x=>!used.has(x.i));
  if(unused.length>=N){
    return {cycled:false,list:sample(unused,N).map(x=>({x:x,track:true}))};
  }
  const keep=new Set(unused.map(x=>x.i));
  const rest=WORDS.filter(x=>!keep.has(x.i));
  const extra=sample(rest,N-unused.length);
  used=new Set();
  return {cycled:true,list:shuffle(unused.map(x=>({x:x,track:false})).concat(extra.map(x=>({x:x,track:true}))))};
}

/* ================= 页面切换 ================= */
const screens={home:$('#home'),quiz:$('#quiz'),result:$('#result')};
function show(name){
  for(const k in screens) screens[k].hidden = (k!==name);
  window.scrollTo(0,0);
}
function twoStep(btn,armedText,fn){
  const orig=btn.textContent; let t=null;
  btn.addEventListener('click',function(){
    if(btn.dataset.armed){ clearTimeout(t); delete btn.dataset.armed; btn.textContent=orig; fn(); return; }
    btn.dataset.armed='1'; btn.textContent=armedText;
    t=setTimeout(function(){ delete btn.dataset.armed; btn.textContent=orig; },3000);
  });
}

/* ================= 首页 ================= */
function refreshHome(){
  const total=WORDS.length, seen=Math.min(used.size,total);
  document.querySelectorAll('.total').forEach(e=>e.textContent=total);
  $('#coverFill').style.width=(seen/total*100).toFixed(1)+'%';
  let t='已测过 '+seen+' / '+total+' 个词条';
  if(mem.rounds>0) t+='，完成 '+mem.rounds+' 轮，最高分 '+mem.best+' / '+N;
  else t+='，还没有测过，现在开始吧';
  $('#coverText').textContent=t;
}
twoStep($('#btnReset'),'再点一次确认清除',function(){
  used=new Set(); mem.best=0; mem.rounds=0; save(); refreshHome(); toast('学习记录已清除');
});

/* ================= 答题流程 ================= */
const S={qs:[],idx:0,right:0,wrong:[],results:[],answered:false};
const LETTERS=['A','B','C','D'];

function buildWall(box){
  box.textContent='';
  for(let i=0;i<N;i++) box.appendChild(document.createElement('span'));
}
function paintWall(box){
  const cells=box.children;
  for(let i=0;i<N;i++){
    const c=cells[i]; c.className='';
    if(S.results[i]===true) c.className='ok';
    else if(S.results[i]===false) c.className='no';
    else if(box.id==='wall' && i===S.idx) c.className='cur';
  }
}

function startRound(){
  ctx();
  const pk=pickWords();
  S.qs=pk.list.map(function(it){ const o=makeOptions(it.x); return {x:it.x,track:it.track,opts:o.opts,ans:o.ans}; });
  S.idx=0; S.right=0; S.wrong=[]; S.results=[]; S.answered=false;
  $('#autoSpeak').checked=!!mem.auto;
  buildWall($('#wall'));
  show('quiz'); sfx.start();
  renderQ();
  if(pk.cycled) toast('整本词库已经过完一遍，从头开始新一轮');
}

function renderQ(){
  const q=S.qs[S.idx]; S.answered=false;
  $('#qNum').textContent=S.idx+1;
  $('#qRight').textContent=S.right;
  $('#wordText').textContent=q.x.w;
  const wb=$('#word'); const L=q.x.w.length;
  wb.className='word'+(L>40?' xl':L>26?' l':L>14?' m':'');
  const box=$('#opts'); box.textContent=''; box.classList.remove('done');
  q.opts.forEach(function(o,k){
    const b=el('button','opt'); b.type='button'; b.dataset.i=k;
    b.appendChild(el('span','key',LETTERS[k]));
    b.appendChild(el('span','txt',o.full));
    b.addEventListener('click',()=>answer(k));
    box.appendChild(b);
  });
  $('#fb').textContent='';
  const nx=$('#btnNext'); nx.disabled=true; nx.textContent=(S.idx===N-1)?'查看成绩':'下一题';
  paintWall($('#wall'));
  if(mem.auto) setTimeout(()=>speak(q.x.w,$('#word')),200);
}

function answer(k){
  if(S.answered) return; S.answered=true;
  const q=S.qs[S.idx], good=(k===q.ans);
  if(q.track) used.add(q.x.i);
  S.results[S.idx]=good;
  if(good) S.right++; else S.wrong.push(q.x);

  const box=$('#opts'); box.classList.add('done');
  Array.prototype.forEach.call(box.children,function(b,i){
    if(i===q.ans) b.classList.add('right');
    else if(i===k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb=$('#fb'); fb.textContent='';
  fb.appendChild(el('span','stamp '+(good?'good':'bad'),good?'牛逼！':'回答错误啦'));
  if(!good){
    const a=el('span','ans','正确答案：'); a.appendChild(el('b',null,LETTERS[q.ans])); fb.appendChild(a);
  }
  good?sfx.right():sfx.wrong();
  $('#qRight').textContent=S.right;
  paintWall($('#wall')); save();
  const nx=$('#btnNext'); nx.disabled=false; nx.focus({preventScroll:true});
  nx.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'});
}

function next(){
  if(!S.answered) return;
  if(S.idx>=N-1){ finish(); return; }
  S.idx++; renderQ();
}

function remark(s){
  if(s===N) return '满分！一题没错。';
  if(s>=45) return '牛逼！只差一点点就满分了。';
  if(s>=38) return '很扎实，错的几个再看一眼就稳了。';
  if(s>=30) return '过关了，继续刷会更稳。';
  if(s>=20) return '还有不少生词，先看看下面的错题。';
  return '这批词比较难，多测几轮就熟了。';
}

function finish(){
  const score=S.right, prevBest=mem.best;
  mem.rounds++; if(score>mem.best) mem.best=score; save();
  show('result');
  buildWall($('#wall2')); paintWall($('#wall2'));
  $('#resPct').textContent='正确率 '+Math.round(score/N*100)+'%';
  $('#resRemark').textContent=remark(score);
  const rec=$('#resRecord'); rec.textContent='';
  if(prevBest>0 && score>prevBest) rec.appendChild(el('span','record','新纪录'));

  const num=$('#resNum');
  if(reduced||score===0){ num.textContent=score; }
  else{
    const t0=performance.now(), dur=700;
    (function tick(now){
      const p=Math.min(1,(now-t0)/dur);
      num.textContent=Math.round(score*(1-Math.pow(1-p,3)));
      if(p<1) requestAnimationFrame(tick);
    })(t0);
  }
  sfx.finish(score);

  const list=$('#wrongList'); list.textContent='';
  if(!S.wrong.length){
    $('#reviewSub').textContent='';
    const li=el('li',null,'这一轮全部答对，没有错题。'); li.style.display='block'; list.appendChild(li);
  }else{
    $('#reviewSub').textContent='共 '+S.wrong.length+' 个，点单词可以再听一遍发音。';
    S.wrong.forEach(function(x){
      const li=document.createElement('li');
      const left=el('div','rv-word');
      const b=el('button'); b.type='button'; b.setAttribute('aria-label','朗读 '+x.w);
      b.appendChild(el('span',null,x.w));
      b.insertAdjacentHTML('beforeend','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>');
      b.addEventListener('click',()=>speak(x.w));
      left.appendChild(b);
      li.appendChild(left);
      li.appendChild(el('div','rv-mean',x.full));
      list.appendChild(li);
    });
  }
}

/* ================= 事件 ================= */
$('#btnStart').addEventListener('click',startRound);
$('#btnAgain').addEventListener('click',startRound);
$('#btnHome').addEventListener('click',function(){ refreshHome(); show('home'); });
$('#btnNext').addEventListener('click',next);
$('#word').addEventListener('click',function(){ speak(S.qs[S.idx].x.w,$('#word')); });
$('#autoSpeak').addEventListener('change',function(e){ mem.auto=e.target.checked; save(); });
twoStep($('#btnQuit'),'确认退出？',function(){
  try{ if(canSpeak) speechSynthesis.cancel(); }catch(e){}
  refreshHome(); show('home');
});
document.addEventListener('keydown',function(e){
  if(screens.quiz.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const k=e.key.toLowerCase();
  const idx={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[k];
  if(idx!==undefined){ e.preventDefault(); answer(idx); }
  else if(e.key==='ArrowRight' && S.answered){ e.preventDefault(); next(); }
});

refreshHome();
})();
</script>
